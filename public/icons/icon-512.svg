<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- App Icon Background (Squircle) -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="112" fill="none" stroke="#27272a" stroke-width="4"/>

  <!-- Subtle Accent Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#f59e0b" stroke-opacity="0.15" stroke-width="2"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#f59e0b" stroke-opacity="0.25" stroke-dasharray="8 12" stroke-width="2"/>

  <!-- Glowing Glow Center -->
  <circle cx="256" cy="256" r="90" fill="#f59e0b" fill-opacity="0.08" filter="url(#glow)"/>

  <!-- Stylized "F" with Flow / Wings -->
  <g fill="url(#amberGrad)" filter="url(#glow)">
    <!-- Vertical Bar -->
    <rect x="180" y="140" width="36" height="232" rx="12" />
    <!-- Top Bar -->
    <path d="M180 152 C 180 144, 186 140, 194 140 L 320 140 C 330 140, 336 150, 330 158 C 322 170, 308 176, 290 176 L 194 176 C 186 176, 180 170, 180 162 Z" />
    <!-- Middle Bar (Flowing) -->
    <path d="M180 236 C 180 228, 186 224, 194 224 L 280 224 C 290 224, 295 234, 290 242 C 282 254, 268 260, 252 260 L 194 260 C 186 260, 180 254, 180 246 Z" />
    <!-- Flow Dot / Spark -->
    <circle cx="340" cy="242" r="12" fill="#fbbf24" />
  </g>
</svg>
